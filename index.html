    --navy:#0B2545;
    --blue:#1D5FD6;
    --blue-light:#4FA9FF;
    --bg:#F3F7FC;
    --card-bg:#FFFFFF;
    --border:#E1E8F2;
    --text:#182338;
    --text-muted:#5B6B82;
    --red:#C0392B;
    --red-bg:#FCEEEC;
    --teal:#0F8C7C;
    --emerald:#1B6B4A;
    --indigo:#3F4B9E;
    --indigo-bg:#ECEEF9;
    --emerald-bg:#E6F3EC;
    --teal-bg:#E7F6F3;
    --purple:#6B4C9A;
    --purple-bg:#F1ECF7;
    --amber:#B4790F;
    --amber-bg:#FBF1E1;
    --slate:#5B6B82;
    --slate-bg:#EDF1F6;
    --sky:#2E86DE;
    --sky-bg:#EAF3FD;
    --radius:12px;
    --shadow:0 1px 2px rgba(11,37,69,.05), 0 6px 18px rgba(11,37,69,.06);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Fond d'écran dynamique ----------
     Photo réelle (visuel VMS/DOTR) en plein cadre, calque fixe derrière tout
     le contenu. "cover" + position calée pour garder la Terre visible en bas
     et l'anneau/portail à droite. Descend légèrement au défilement (JS). */
  .bg-layer{
    position:fixed;
    inset:-12vh 0 -12vh 0;
    z-index:-1;
    pointer-events:none;
    background-color:#EAF3FD;
    background-image:var(--bg-photo);
    background-size:cover;
    background-position:center 78%;
    background-repeat:no-repeat;
    transition:transform .12s linear;
  }
  @media (max-width:700px){
    /* Écrans étroits : recentrer un peu plus sur la Terre pour ne pas la perdre. */
    .bg-layer{background-position:32% 85%;}
  }
  @media (prefers-reduced-motion:reduce){
    .bg-layer{transition:none;}
  }
  h1,h2,h3,.brand-word{
    font-family:'Space Grotesk', 'IBM Plex Sans', sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:var(--blue);}
  button{font-family:inherit;}

  /* ---------- Bannière ---------- */
  .hero{
    background:transparent;
    padding:0;
  }
  .hero-inner{
    max-width:1180px;
    margin:0 auto;
    padding:18px clamp(14px,3vw,32px) 4px;
    display:flex;
    justify-content:center;
  }
  /* La bannière est fondue dans le fond : le blanc du visuel devient
     transparent grâce au mode de fusion, et les bords sont estompés. */
  .hero-banner{
    display:block;
    width:100%;
    max-width:1100px;
    height:auto;
    mix-blend-mode:multiply;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 5%, #000 95%, transparent 100%);
            mask-image:linear-gradient(to right, transparent 0, #000 5%, #000 95%, transparent 100%);
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1180px;
    margin:0 auto;
    padding:8px clamp(14px,3vw,32px) 18px;
    display:flex;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
  }
  .search-wrap{
    flex:1 1 320px;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    opacity:.45;
  }
  #search{
    width:100%;
    padding:12px 14px 12px 40px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card-bg);
    font-size:15px;
    color:var(--text);
    box-shadow:var(--shadow);
  }
  #search:focus{
    outline:2px solid var(--blue-light);
    outline-offset:1px;
  }
  .status-msg{
    color:var(--text-muted);
    font-size:13.5px;
    white-space:nowrap;
  }

  /* ---------- Layout ---------- */
  .layout{
    max-width:1180px;
    margin:0 auto;
    padding:0 clamp(14px,3vw,32px) 60px;
    display:grid;
    grid-template-columns:250px 1fr;
    gap:28px;
    align-items:start;
  }

  .sidebar{
    position:sticky;
    top:16px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .sidebar-label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-muted);
    margin:14px 0 6px;
    padding:0 10px;
  }
  .sidebar-label:first-child{margin-top:0;}
  .nav-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    padding:9px 10px;
    border-radius:9px;
    cursor:pointer;
    color:var(--text);
    font-size:14.5px;
  }
  .nav-btn:hover{background:rgba(29,95,214,.07);}
  .nav-btn.active{background:var(--card-bg); box-shadow:var(--shadow); font-weight:600;}
  .nav-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--dot,var(--blue));
    flex:none;
  }
  .nav-icon{font-size:15px; flex:none; width:18px; text-align:center;}

  /* ---------- Sigles des rubriques ---------- */
  .cat-icon{
    flex:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--pillbg,var(--sky-bg));
    color:var(--pill,var(--blue));
    box-shadow:inset 0 0 0 1px rgba(11,37,69,.10);
  }
  .cat-icon svg{width:60%; height:60%;}
  .cat-icon-sm{width:28px; height:28px;}
  .cat-icon-xs{width:20px; height:20px; margin-right:6px;}
  .cat-icon-lg{width:46px; height:46px;}
  .nav-btn.active .cat-icon{
    background:#fff;
    box-shadow:inset 0 0 0 1px rgba(11,37,69,.16);
  }
  .nav-label{flex:1; min-width:0; color:var(--pill,var(--text)); font-weight:700; text-shadow:0 0 1px rgba(255,255,255,.9), 0 0 10px rgba(255,255,255,.75);}
  .nav-count{
    font-size:12px;
    color:var(--text-muted);
    background:var(--slate-bg);
    border-radius:20px;
    padding:1px 7px;
    flex:none;
  }

  /* ---------- Content ---------- */
  .content{min-width:0;}
  .panel-head{margin-bottom:18px;}
  .panel-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:0;
    font-size:12.5px;
    font-weight:600;
    color:var(--pill,var(--blue));
    background:var(--pillbg,var(--sky-bg));
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .panel-title{font-size:24px; font-weight:700; text-shadow:0 0 2px rgba(255,255,255,.85), 0 0 14px rgba(255,255,255,.7);}
  .panel-desc{
    color:var(--text-muted);
    margin-top:6px;
    max-width:68ch;
    font-size:14.5px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
  }

  .card{
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.75);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
    animation:cardIn .25s ease both;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:none;}
  }
  .card-title{
    font-size:15px;
    font-weight:600;
    line-height:1.35;
  }
  .card-tag{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:600;
    color:var(--pill,var(--blue));
    background:var(--pillbg,var(--sky-bg));
    padding:2px 9px;
    border-radius:20px;
  }
  .card-open{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:600;
    color:var(--blue);
    text-decoration:none;
    padding-top:2px;
  }
  .card-open:hover{text-decoration:underline;}

  /* ---------- Cartes "outil interactif" (Neuroleptiques, Benzodiazépines) ---------- */
  .card-featured{
    background:linear-gradient(165deg, var(--pillbg,var(--sky-bg)) 0%, rgba(255,255,255,.9) 60%);
    border:1px solid var(--pill,var(--blue));
    border-radius:var(--radius);
    padding:16px 18px;
    box-shadow:0 2px 10px rgba(11,37,69,.10);
    display:flex;
    flex-direction:column;
    gap:12px;
    animation:cardIn .25s ease both;
    grid-column:1 / -1;
  }
  .card-badge{
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    color:#fff;
    background:var(--pill,var(--blue));
    padding:3px 10px;
    border-radius:20px;
    letter-spacing:.02em;

  .card-featured .card-title{font-size:16.5px;}
  .card-dual-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .card-dual-actions button{
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:700;
    color:#fff;
    background:var(--pill,var(--blue));
    border:none;
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;

  .card-dual-actions .card-dual-secondary{
    color:var(--pill,var(--blue));
    background:#fff;
    box-shadow:inset 0 0 0 1.5px var(--pill,var(--blue));

  /* ---------- Moteur d'aide à la prescription (benzodiazépines) ---------- */
  .benzo-sliders{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:18px;
    padding:16px 18px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .benzo-slider-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .benzo-slider-head label{font-size:13.5px; font-weight:600; color:var(--text);}
  .benzo-slider-value{
    font-size:15px;
    font-weight:700;
    color:var(--pill,var(--blue));
    min-width:18px;
    text-align:right;
  }
  .benzo-slider-row input[type="range"]{
    width:100%;
    accent-color:var(--pill,var(--blue));
    height:6px;
    cursor:pointer;
  }
  .benzo-result-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .benzo-result-card{
    background:var(--pillbg,var(--sky-bg));

    border-radius:var(--radius);
    padding:12px 14px;
    text-align:center;
  }
  .benzo-result-best{

    transform:scale(1.03);
  }
  .benzo-result-rank{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--pill,var(--blue));
    margin-bottom:6px;
  }
  .benzo-result-name{font-size:15px; font-weight:700; color:var(--text);}
  .benzo-result-brand{font-size:12.5px; font-weight:700; color:var(--text-muted); margin-top:2px;}

  /* ---------- Ordonnance de biologie (module "Suivis biologiques") ---------- */
  .bio-bubble{cursor:pointer; border:2px solid transparent; padding:16px 10px;}
  .bio-bubble-active{border-color:var(--pill,var(--blue)); background:#fff;}
  .bio-check{
    font-size:11px;
    font-weight:700;
    color:var(--text-muted);
    margin-top:2px;
  }
  .bio-bubble-active .bio-check{color:var(--pill,var(--blue));}
  .bio-grade-wrap{
    margin-top:16px;
    padding:14px 16px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .bio-grade-options{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .bio-grade-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    background:var(--slate-bg);
    border:2px solid transparent;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .bio-grade-active{
    border-color:var(--purple);
    background:var(--purple-bg);
    color:var(--purple);
  }
  .bio-result-box{
    margin-top:18px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .bio-result-head{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .bio-result-head strong{font-size:15px;}
  .bio-result-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .bio-copy-btn, .bio-reset-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    border:none;
  }
  .bio-copy-btn{color:#fff; background:var(--teal);}
  .bio-copy-btn:hover{opacity:.92;}
  .bio-reset-btn{color:var(--text-muted); background:var(--slate-bg);}
  .bio-result-list{
    margin:0 0 12px;
    padding-left:20px;
    font-size:13.5px;
    line-height:1.7;
    columns:2;
    column-gap:24px;
  }
  .bio-textarea{
    width:100%;
    font-family:inherit;
    font-size:13px;
    color:var(--text-muted);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    resize:vertical;
  }
  .bio-result-preview{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
  }
  .bio-result-heading{
    font-weight:700;
    text-decoration:underline;
    font-size:14px;
    margin:0 0 10px;
    color:var(--text);
  }
  .bio-result-preview .bio-result-list{
    margin:0;
    padding-left:20px;
    font-size:13.5px;
    line-height:1.7;
  }
  .bio-freq-heading{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--border);
    font-size:13px;
  }
  .bio-freq-list{
    margin:0;
    padding-left:20px;
    font-size:12.5px;
    line-height:1.6;
    color:var(--text-muted);
  }
  .bio-freq-list strong{color:var(--text);}

  /* ---------- Calculateurs cliniques ---------- */
  .calc-box{
    margin-top:16px;
    padding:16px 18px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .calc-fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
  }
  .calc-field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--text);}
  .calc-field input, .calc-field select{
    font-family:inherit;
    font-size:14.5px;
    font-weight:400;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 11px;
    background:var(--bg);
  }
  .calc-field input:focus, .calc-field select:focus{outline:2px solid var(--blue-light); outline-offset:1px;}
  .calc-result{
    margin-top:16px;
    padding:16px 18px;
    background:var(--pillbg,var(--sky-bg));
    border-left:4px solid var(--pill,var(--blue));
    border-radius:var(--radius);
  }
  .calc-result-main{font-size:26px; font-weight:700; color:var(--pill,var(--blue)); line-height:1.15;}
  .calc-result-sub{font-size:14px; font-weight:600; color:var(--text); margin-top:4px;}
  .calc-result-extra{font-size:12.5px; color:var(--text-muted); margin-top:8px;}
  .courrier-fields{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
  .courrier-field textarea{
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 11px;
    background:var(--bg);
    resize:vertical;
  }
  .courrier-field textarea:focus{outline:2px solid var(--blue-light); outline-offset:1px;}
  .courrier-preview{
    font-size:13.5px;
    line-height:1.65;
    white-space:normal;
    max-height:none;
  }
  .acb-suggestions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .acb-suggestion{
    font-family:inherit; font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px;
    color:var(--text); background:var(--slate-bg);
    border:none; padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  .acb-suggestion:hover{background:var(--sky-bg);}
  .acb-score{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%;
    font-size:11.5px; font-weight:700; color:#fff; flex:none;
  }
  .acb-score-1{background:var(--sky);}
  .acb-score-2{background:var(--amber);}
  .acb-score-3{background:var(--red);}
  .acb-list{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .acb-list li{
    display:flex; align-items:center; gap:9px;
    font-size:13.5px; padding:7px 10px;
    background:var(--bg); border-radius:8px;
  }
  .acb-remove{
    margin-left:auto; font-family:inherit; font-size:16px; line-height:1;
    color:var(--text-muted); background:none; border:none; cursor:pointer; padding:2px 6px;
  }
  .acb-remove:hover{color:var(--red);}
  .vaccin-list{margin:4px 0 0; padding-left:20px; font-size:13.5px; line-height:1.65;}
  .vaccin-schema{font-size:14px; font-weight:600; color:var(--text); line-height:1.5;}
  .calc-hint{
    margin-top:16px;
    padding:12px 16px;
    font-size:13px;
    color:var(--text-muted);
    background:var(--slate-bg);
    border-radius:8px;
  }

  .bio-layout{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:20px;
    align-items:start;
    margin-top:16px;
  }
  .bio-layout-right{position:sticky; top:16px;}
  @media (max-width:900px){
    .bio-layout{grid-template-columns:1fr;}
    .bio-layout-right{position:static;}
  }

  .bio-options-wrap{
    padding:16px 18px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .bio-options-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:8px;
    margin-top:10px;
  }
  .bio-option-pair-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .bio-option-pair-row .bio-option-row{flex:1 1 220px;}
  .bio-option-group{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--border);
  }
  .bio-option-group-indication{
    font-size:11.5px;
    color:var(--text-muted);
    margin:0 0 8px;
  }
  .bio-option-group-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .bio-option-group-row .bio-option-row{flex:1 1 160px;}
  .bio-option-row-compact{padding:8px 10px;}
  .bio-option-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:9px 10px;
    border-radius:9px;
    cursor:pointer;
    font-size:13px;
  }
  .bio-option-row:hover{background:var(--slate-bg);}
  .bio-option-checked{background:var(--teal-bg);}
  .bio-option-row input[type="checkbox"]{margin-top:3px; accent-color:var(--teal); flex:none;}
  .bio-option-label{display:block; font-weight:600; color:var(--text);}
  .bio-option-indication{display:block; font-size:11.5px; color:var(--text-muted); margin-top:1px;}
  .bio-custom-add{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .bio-custom-add input{
    flex:1;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 11px;
    background:var(--bg);
  }
  .bio-custom-add button{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    border:none;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
  }
  .bio-custom-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .bio-custom-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
    background:var(--slate-bg);
    padding:5px 6px 5px 12px;
    border-radius:20px;
  }
  .bio-custom-pill button{
    font-family:inherit;
    font-size:14px;
    line-height:1;
    color:var(--text-muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:2px 6px;
  }
  .bio-custom-pill button:hover{color:var(--red);}

  .empty-state, .error-state{
    border:1px dashed var(--border);
    border-radius:var(--radius);
    padding:26px 22px;
    color:var(--text-muted);
    font-size:14.5px;
    max-width:60ch;
    background:rgba(255,255,255,.5);
  }
  .empty-state code{
    background:var(--slate-bg);
    padding:1px 6px;
    border-radius:5px;
    font-size:13px;
  }

  .skeleton{
    height:78px;
    border-radius:var(--radius);
    background:linear-gradient(90deg, #eef2f8 25%, #f7fafd 37%, #eef2f8 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{
    0%{background-position:100% 0;}
    100%{background-position:0 0;}
  }

  /* Resources */
  .res-group{margin-bottom:26px;}
  .res-group-heading{margin-bottom:12px;}
  .res-group-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:14.5px;
    font-weight:700;
    color:var(--pill,var(--blue));
    background:var(--pillbg,var(--sky-bg));
    padding:5px 13px;
    border-radius:20px;
  }
  .res-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
  }
  .res-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-left:3px solid var(--pill,var(--border));

    display:flex;
    flex-direction:column;

  .res-name{font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .res-url{font-size:12.5px; color:var(--pill,var(--blue));}
  .res-desc{font-size:13.5px; color:var(--text-muted);}

  .partner-card{

    box-shadow:var(--shadow);
    margin-bottom:24px;

  .partner-card p{color:#c7d3e6; font-size:14px; margin:0 0 12px; max-width:62ch;}
  .partner-links{display:flex; gap:10px; flex-wrap:wrap;}
  .partner-links a{
    background:rgba(255,255,255,.12);
    color:#fff;
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:8px;
  }
  .partner-links a:hover{background:rgba(255,255,255,.22);}

  .subcat-block{margin-top:22px;}
  .subcat-block:first-child{margin-top:0;}
  .subcat-heading{
    font-family:'Space Grotesk','IBM Plex Sans',sans-serif;
    font-size:18px;
    font-weight:700;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }

  .theme-block{margin-top:18px; padding-left:14px; border-left:3px solid var(--pill, var(--border));}
  .theme-block:first-child{margin-top:0;}
  .theme-heading{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
  }
  .theme-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:14.5px;
    font-weight:700;
    color:var(--pill,var(--blue));
    background:var(--pillbg,var(--sky-bg));
    padding:4px 12px;
    border-radius:20px;
  }
  .theme-heading .nav-count{font-size:11.5px; padding:1px 7px;}

  /* ---------- Médicaments écrasables ---------- */
  .medoc-search-wrap{
    position:relative;
    margin-bottom:18px;
  }
  .medoc-search-wrap svg{

    left:14px;

    transform:translateY(-50%);
    opacity:.45;
  }
  #medocSearch{

    padding:13px 14px 13px 42px;
    border-radius:10px;
    border:1px solid var(--border);

    color:var(--text);
    box-shadow:var(--shadow);
  }

    outline:2px solid var(--blue-light);
    outline-offset:1px;
  }

  }
  .medoc-card{
    background:var(--card-bg);

    border-radius:var(--radius);

    box-shadow:var(--shadow);
    animation:cardIn .2s ease both;
  }
  .medoc-head{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 10px;
  }
  .medoc-name{

    font-weight:600;
    font-size:15.5px;
    color:var(--text);
  }
  .medoc-badges{display:flex; flex-wrap:wrap; gap:6px;}
  .medoc-badge{
    font-size:11.5px;

  .medoc-meta{

  .medoc-row{

    border-top:1px solid var(--border);

  .medoc-label{
    display:block;
    font-size:11.5px;

  .doc-note p{margin:0;}
  .doc-section{
    border-radius:var(--radius);
    border-left:4px solid var(--tone,var(--blue));
    background:var(--tonebg,var(--sky-bg));
    padding:14px 18px 16px;
    margin-bottom:14px;
  }
  .doc-section h3{
    font-size:14.5px;
    color:var(--tone,var(--blue));
    margin-bottom:8px;
  }
  .doc-section p{margin:0 0 8px; font-size:13.8px; line-height:1.55;}
  .doc-section p:last-child{margin-bottom:0;}
  .doc-section ul{margin:6px 0; padding-left:20px; font-size:13.8px; line-height:1.55;}
  .doc-section li{margin-bottom:4px;}
  .doc-subgrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    margin-top:6px;
  }
  .doc-subcard{
    background:rgba(255,255,255,.6);
    border-radius:9px;
    padding:10px 12px;
  }
  .doc-subcard h4{font-size:13px; margin-bottom:5px; color:var(--text);}
  .doc-subcard ul{margin:0; padding-left:16px; font-size:13px;}
  table.doc-table{
    width:100%;
    border-collapse:collapse;
    font-size:13.3px;
    margin-top:6px;
    background:rgba(255,255,255,.55);
    border-radius:8px;
    overflow:hidden;
  }
  table.doc-table th, table.doc-table td{
    text-align:left;
    padding:7px 10px;
    border-bottom:1px solid rgba(11,37,69,.08);
    vertical-align:top;
  }
  table.doc-table th{font-weight:600; font-size:12.5px;}
  table.doc-table tr:last-child td{border-bottom:none;}
  .doc-embed-wrap{
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-top:6px;
  }
  .doc-embed-wrap embed{
    display:block;
    width:100%;
    height:72vh;
  }
  .doc-embed-actions{
    display:flex;
    gap:10px;
    padding:12px 14px;
    background:var(--card-bg);
    border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .doc-embed-actions a{
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
  }
  .fill-box{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px 16px;
    margin:16px 0;
  }
  .fill-box-head{
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:10px;
    line-height:1.4;
  }
  .fill-box-fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
    margin-bottom:12px;
  }
  .fill-box-fields label{
    display:flex;
    flex-direction:column;
    gap:5px;
    font-size:12.5px;
    font-weight:600;
    color:var(--text);
  }
  .fill-box-fields input{
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 11px;
    background:var(--bg);
  }
  .fill-box-fields input:focus{
    outline:2px solid var(--blue-light);
    outline-offset:1px;
  }
  .fill-download-btn{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    background:var(--teal);
    border:none;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
  }
  .fill-download-btn:hover{opacity:.92;}
  .fill-status{
    font-size:12.5px;
    color:var(--text-muted);
    margin:8px 0 0;
  }
  .doc-image-frame{
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    background:#fff;
    margin:6px 0 16px;
  }
  .doc-image-frame img{display:block; width:100%; height:auto;}
  .doc-note{
    font-size:12.5px;
    color:var(--text-muted);
    background:var(--slate-bg);
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:16px;
  }

  /* ---------- Neuroleptiques classiques (rubrique interactive) ---------- */
  .neurolep-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
    margin-top:16px;
  }
  .neurolep-bubble{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    text-align:center;
    padding:18px 10px;
    border-radius:16px;
    border:none;
    cursor:pointer;
    background:var(--pillbg,var(--sky-bg));
    box-shadow:0 1px 2px rgba(11,37,69,.08);
    transition:transform .12s ease;
  }
  .neurolep-bubble:hover{transform:translateY(-2px);}
  .neurolep-dci{font-weight:700; font-size:14.5px; color:var(--pill,var(--blue));}
  .neurolep-brand{font-size:12px; font-weight:700; color:var(--text-muted);}
  .neurolep-brand-title{font-size:15px; font-weight:500; color:var(--text-muted); text-shadow:none;}
  .neurolep-form-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-left:4px solid var(--pill,var(--border));
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
    margin-top:14px;
  }
  .neurolep-indication{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--pill,var(--blue));
    background:var(--pillbg,var(--sky-bg));
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .neurolep-row{
    font-size:13.5px;
    margin-bottom:6px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .neurolep-label{font-weight:600; color:var(--text-muted); flex:none;}
  .neurolep-stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .neurolep-stat{display:flex; flex-direction:column; gap:2px;}
  .neurolep-stat-label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
  .neurolep-stat-value{font-size:15px; font-weight:700; color:var(--text);}
  .neurolep-populations{
    background:var(--amber-bg);
    border-left:4px solid var(--amber);
    border-radius:var(--radius);
    padding:12px 16px;
    margin-top:18px;
    font-size:13.5px;
  }
  .neurolep-populations strong{display:block; color:var(--amber); margin-bottom:6px;}
  .neurolep-populations ul{margin:0; padding-left:18px;}
  .neurolep-populations li{margin-bottom:4px;}

  /* Marge de respiration en bas de page (le pied de page a été retiré). */
  .layout{padding-bottom:48px;}

  /* Mobile */
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
    .sidebar{
      position:static;
      flex-direction:row;
      flex-wrap:wrap;
      gap:6px;
    }
    .sidebar-label{display:none;}
    .nav-btn{width:auto; padding:8px 12px; border:1px solid var(--border);}
    .nav-count{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; scroll-behavior:auto !important;}
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }
</style>

function colorVars(color){
  const map = {
    red:    { pill: "var(--red)",    pillbg: "var(--red-bg)"    },
    blue:   { pill: "var(--blue)",   pillbg: "var(--sky-bg)"    },
    teal:   { pill: "var(--teal)",   pillbg: "var(--teal-bg)"   },
    purple: { pill: "var(--purple)", pillbg: "var(--purple-bg)" },
    navy:   { pill: "var(--navy)",   pillbg: "var(--slate-bg)"  },
    slate:  { pill: "var(--slate)",  pillbg: "var(--slate-bg)"  },
    amber:  { pill: "var(--amber)",  pillbg: "var(--amber-bg)"  },
    sky:    { pill: "var(--sky)",    pillbg: "var(--sky-bg)"    },
    emerald:{ pill: "var(--emerald)", pillbg: "var(--emerald-bg)" },
    indigo: { pill: "var(--indigo)",  pillbg: "var(--indigo-bg)"  }
  };
  return map[color] || map.blue;
}

function renderCategoryPanel(cat){
  const c = colorVars(cat.color);
  const items = protocolsFor(cat.id);

  let body;
  if(items.length === 0){
    body = `
      <div class="empty-state">
        Aucun document pour l'instant dans cette rubrique.
        Ajoute une entrée dans <code>DOCUMENTS</code>, en haut du fichier <code>index.html</code>, pour qu'il apparaisse ici.
      </div>
    `;
  }else{
    const direct = items
      .filter(it => !it.subcategory)
      .slice()
      .sort((a, b) => (b.interactive ? 1 : 0) - (a.interactive ? 1 : 0));
    const subIds = [...new Set(items.filter(it => it.subcategory).map(it => it.subcategory))];

    const directHTML = direct.length ? `<div class="grid">${direct.map(it => cardHTML(it, cat)).join("")}</div>` : "";

    const subHTML = subIds.map(subId => {
      const subItems = items.filter(it => it.subcategory === subId);
      const label = SUBCATEGORIES[subId] || subId;

      // Niveau 3 : regroupement par thème clinique à l'intérieur de la sous-catégorie.
      const directSub = subItems
        .filter(it => !it.theme)
        .slice()
        .sort((a, b) => a.title.localeCompare(b.title, "fr"));
      const themeIds = [...new Set(subItems.filter(it => it.theme).map(it => it.theme))];

      const directSubHTML = directSub.length ? `<div class="grid">${directSub.map(it => cardHTML(it, cat)).join("")}</div>` : "";

      const themeHTML = themeIds.map(themeId => {
        const themeItems = subItems
          .filter(it => it.theme === themeId)
          .slice()
          .sort((a, b) => a.title.localeCompare(b.title, "fr"));
        const theme = THEMES[themeId] || { label: themeId, icon: "", color: "blue" };
        const tc = colorVars(theme.color);
        return `
          <div class="theme-block" style="--pill:${tc.pill};--pillbg:${tc.pillbg}">
            <h4 class="theme-heading">
              <span class="theme-pill">${theme.icon} ${theme.label}</span>
              <span class="nav-count">${themeItems.length}</span>
            </h4>
            <div class="grid">${themeItems.map(it => cardHTML(it, cat)).join("")}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="subcat-block">
          <h3 class="subcat-heading">${label} <span class="nav-count">${subItems.length}</span></h3>
          ${directSubHTML}
          ${themeHTML}
        </div>
      `;
    }).join("");

    body = directHTML + subHTML;
  }

  contentEl.innerHTML = `
    <div class="panel-head">
      <span class="panel-eyebrow" style="--pill:${c.pill};--pillbg:${c.pillbg}">${categoryIconHTML(cat.icon, cat.color, "xs")}${cat.label}</span>
      <h2 class="panel-title" style="color:${c.pill}">${cat.label}</h2>
      <p class="panel-desc">${cat.description}</p>
    </div>
    ${body}
  `;
}

/* Coordonnées (en points PDF, origine en bas à gauche) des zones de saisie,
   identiques sur tous les protocoles AS/Éduc & IDE (même gabarit). */
const FILL_ZONES = {
  etablissement: { x: 56,  y: 772, maxWidth: 220, size: 10.5, lineHeight: 12.5 }, // encadré "Établissement" (3 lignes possibles)
  medecin:       { x: 321, y: 772, maxWidth: 220, size: 10.5, lineHeight: 12.5 }, // encadré "Médecin" (3 lignes possibles)
  lieu:          { x: 95,  y: 127, size: 9.5 },  // au-dessus des pointillés "Fait à ...................."
  jour:          { x: 291, y: 127, size: 10 },   // au-dessus des pointillés "Le : .... /"
  mois:          { x: 335, y: 127, size: 10 },   // au-dessus des pointillés " .... /"
  annee:         { x: 376, y: 127, size: 10 }    // au-dessus des pointillés " ...."
};

async function downloadFilledPdf(doc){
  const statusEl = document.getElementById("fillStatus");
  const etablissement = document.getElementById("fillEtablissement").value.trim();
  const medecinInput = document.getElementById("fillMedecin").value.trim();
  const lieu = document.getElementById("fillLieu").value.trim();
  const dateValue = document.getElementById("fillDate").value; // format natif "AAAA-MM-JJ", ou vide

  if(!etablissement && !medecinInput && !lieu && !dateValue){
    statusEl.textContent = "Renseigne au moins un champ, ou utilise le PDF vierge ci-dessous.";
    return;
  }

  // Ajoute "Docteur " devant le nom du médecin, sauf s'il est déjà présent.
  const medecin = medecinInput && !/^(dr|docteur)\b/i.test(medecinInput)
    ? "Docteur " + medecinInput
    : medecinInput;

  statusEl.textContent = "Génération du PDF…";

  try{
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    // Le PDF vierge est un fichier à part (voir doc.path) : on va le chercher
    // avant de pouvoir le pré-remplir et le proposer au téléchargement.
    const response = await fetch(doc.path);
    if(!response.ok) throw new Error("PDF introuvable");
    const existingBytes = await response.arrayBuffer();
    const pdfDoc = await PDFDocument.load(existingBytes);
    const page = pdfDoc.getPages()[0];
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const color = rgb(0.09, 0.145, 0.27);

    if(etablissement){
      const z = FILL_ZONES.etablissement;
      page.drawText(etablissement, { x: z.x, y: z.y, size: z.size, lineHeight: z.lineHeight, font, color, maxWidth: z.maxWidth });
    }
    if(medecin){
      const z = FILL_ZONES.medecin;
      page.drawText(medecin, { x: z.x, y: z.y, size: z.size, lineHeight: z.lineHeight, font, color, maxWidth: z.maxWidth });
    }
    if(lieu){
      const z = FILL_ZONES.lieu;
      page.drawText(lieu, { x: z.x, y: z.y, size: z.size, font, color });
    }
    if(dateValue){
      // dateValue au format "AAAA-MM-JJ" (natif du champ <input type="date">).
      const [annee, mois, jour] = dateValue.split("-");
      page.drawText(jour,  { x: FILL_ZONES.jour.x,  y: FILL_ZONES.jour.y,  size: FILL_ZONES.jour.size,  font, color });
      page.drawText(mois,  { x: FILL_ZONES.mois.x,  y: FILL_ZONES.mois.y,  size: FILL_ZONES.mois.size,  font, color });
      page.drawText(annee, { x: FILL_ZONES.annee.x, y: FILL_ZONES.annee.y, size: FILL_ZONES.annee.size, font, color });
    }

    const bytes = await pdfDoc.save();
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = doc.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = "PDF téléchargé.";
  }catch(err){
    console.error(err);
    statusEl.textContent = "Impossible de générer le PDF rempli. Le PDF vierge reste téléchargeable ci-dessous.";
  }
}

function escapeHtml(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function normalizeSearch(str){
  return String(str)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function modalitesBadgesHTML(mod){
  if(!mod) return "";
  return mod.split(",").map(s => s.trim()).filter(Boolean).map(code => {
    const legend = MODALITES_LEGEND[code];
    if(!legend) return `<span class="medoc-badge medoc-badge-plain">${escapeHtml(code)}</span>`;
    const c = colorVars(legend.color);
    return `<span class="medoc-badge" style="--pill:${c.pill};--pillbg:${c.pillbg}">${escapeHtml(legend.label)}</span>`;
  }).join("");
}

function methodeChipsHTML(meth){
  if(!meth) return "";
  return meth.split(",").map(s => s.trim()).filter(Boolean).map(code => {
    const label = METHODE_LEGEND[code] || code;
    return `<span class="medoc-chip">${escapeHtml(label)}</span>`;
  }).join("");
}

function medocCardHTML(row){
  const metaParts = [row.forme, row.atc3].filter(Boolean).map(escapeHtml);
  const rows = [];
  if(row.meth) rows.push(`<div class="medoc-row"><span class="medoc-label">Comment l'administrer</span><div class="medoc-chips">${methodeChipsHTML(row.meth)}</div></div>`);
  if(row.alt) rows.push(`<div class="medoc-row"><span class="medoc-label">Alternatives galéniques</span><div>${escapeHtml(row.alt).replace(/\n/g, "<br>")}</div></div>`);
  if(row.rcp) rows.push(`<div class="medoc-row"><span class="medoc-label">Info RCP / notice</span><div>${escapeHtml(row.rcp).replace(/\n/g, "<br>")}</div></div>`);
  if(row.labo) rows.push(`<div class="medoc-row"><span class="medoc-label">Réponse laboratoire</span><div>${escapeHtml(row.labo).replace(/\n/g, "<br>")}</div></div>`);
  if(row.autreSrc) rows.push(`<div class="medoc-row"><span class="medoc-label">Autre source</span><div>${escapeHtml(row.autreSrc)}</div></div>`);

  return `
    <div class="medoc-card">
      <div class="medoc-head">
        <div class="medoc-name">${escapeHtml(row.pa)}</div>
        <div class="medoc-badges">
          ${modalitesBadgesHTML(row.mod)}
          ${row.gout === "G" ? `<span class="medoc-badge medoc-badge-plain">Goût désagréable</span>` : ""}
        </div>
      </div>
      ${metaParts.length ? `<div class="medoc-meta">${metaParts.join(" · ")}</div>` : ""}
      ${rows.join("")}
      <div class="medoc-foot">Source : ${escapeHtml(row.srcMod || "—")}${row.maj ? " · MAJ " + escapeHtml(row.maj) : ""}</div>
    </div>
  `;
}

function renderMedocResults(){
  const resultsEl = document.getElementById("medocResults");
  if(!resultsEl) return;

  const q = state.medocQuery.trim();
  if(!q){
    resultsEl.innerHTML = `
      <div class="empty-state">
        Tapez le nom d'un médicament (DCI ou nom commercial) ci-dessus pour savoir s'il peut être écrasé ou sa gélule ouverte.
      </div>
    `;
    return;
  }

  const qn = normalizeSearch(q);
  const matches = MEDICAMENTS_ECRASABLES.filter(row => normalizeSearch(row.pa).includes(qn));

  if(matches.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">Aucun médicament ne correspond à « ${escapeHtml(q)} » dans cette liste.</div>`;
    return;
  }

  const shown = matches.slice(0, 40);
  resultsEl.innerHTML = `
    <p class="medoc-count">${matches.length} résultat${matches.length > 1 ? "s" : ""}${matches.length > 40 ? " — 40 premiers affichés, affinez votre recherche" : ""}</p>
    <div class="medoc-list">${shown.map(medocCardHTML).join("")}</div>
  `;
}

  const resultsEl = document.getElementById("benzoResults");

  const target = state.benzoSliders;

/* Fusionne les examens des situations cochées, sans doublon, dans l'ordre
   canonique du catalogue BIO_TESTS (plutôt que l'ordre de sélection). */
function computeBioTestIds(){
  const picked = [];
  const add = id => { if(!picked.includes(id)) picked.push(id); };
  state.bioSelected.forEach(situId => {
    const situ = BIO_SITUATIONS.find(s => s.id === situId);
    if(!situ) return;
    situ.tests.forEach(add);
    if(situId === "mrc" && state.mrcGrade === "g3bplus"){
      add("nfs-plaquettes");
      add("bicarbonates");
    }
  });
  state.bioOptionsSelected.forEach(optId => {
    const opt = BIO_OPTIONS.find(o => o.id === optId);
    if(!opt) return;
    opt.addIds.forEach(add);
  });
  return Object.keys(BIO_TESTS).filter(id => picked.includes(id));
}

function toggleBioOption(id){
  const idx = state.bioOptionsSelected.indexOf(id);
  if(idx === -1) state.bioOptionsSelected.push(id);
  else state.bioOptionsSelected.splice(idx, 1);

}

function addCustomBioTest(){
  const input = document.getElementById("bioCustomInput");
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const norm = text.toLowerCase();
  const alreadyCanonical = computeBioTestIds().some(id => BIO_TESTS[id].toLowerCase() === norm);
  const alreadyCustom = state.bioCustomTests.some(t => t.toLowerCase() === norm);
  if(!alreadyCanonical && !alreadyCustom){
    state.bioCustomTests.push(text);
  }
  input.value = "";
  renderBioOrdonnancePanel();
}

function renderBioResults(){
  const wrap = document.getElementById("bioResultsWrap");
  if(!wrap) return;

  const ids = computeBioTestIds();
  const customLines = state.bioCustomTests;

  if(ids.length === 0 && customLines.length === 0){
    wrap.innerHTML = `<div class="empty-state" style="margin-top:18px;">Sélectionne au moins une situation clinique ou une option ci-dessus pour construire la liste des examens.</div>`;
    return;
  }

  const lines = ids.map(id => BIO_TESTS[id]).concat(customLines);
  const heading = "Faire pratiquer par Laboratoire d'Analyses Médicales :";

  // Rythme de surveillance : une ligne par situation cochée (la fréquence dépend
  // du contexte clinique global, pas de chaque examen isolé). "mrc" est résolu
  // selon le stade KDIGO choisi.
  // Une ligne par fréquence distincte : les situations qui partagent le même
  // rythme sont regroupées ensemble, pour ne jamais écrire deux fois la même
  // fréquence (ex. Bilan annuel + HTA + AOD/AVK, tous à "Tous les 12 mois").
  const freqByLabel = state.bioSelected.map(situId => {
    const situ = BIO_SITUATIONS.find(s => s.id === situId);
    if(!situ) return null;
    let freq = situ.frequency;
    let label = situ.label;
    if(situId === "mrc"){
      label = `MRC / IRC${state.mrcGrade ? " (stade " + ({ g1g2: "G1-G2", g3a: "G3a", g3bplus: "G3b-G5" })[state.mrcGrade] + ")" : ""}`;
      freq = state.mrcGrade ? MRC_FREQUENCIES[state.mrcGrade] : "Choisis un stade KDIGO ci-dessus pour afficher la fréquence recommandée.";
    }
    return { label, freq };
  }).filter(Boolean);

  const freqGroups = [];
  freqByLabel.forEach(({ label, freq }) => {
    const existing = freqGroups.find(g => g.freq === freq);
    if(existing) existing.labels.push(label);
    else freqGroups.push({ freq, labels: [label] });
  });
  const freqItems = freqGroups.map(g => ({ label: g.labels.join(", "), freq: g.freq }));

  const freqHeading = "Examens à réaliser :";
  const plainText = heading + "\n" + lines.map(l => `- ${l}`).join("\n")
    + (freqItems.length ? "\n\n" + freqHeading + "\n" + freqItems.map(f => `- ${f.label} : ${f.freq}`).join("\n") : "");
  const htmlText = `<p><strong><u>${heading}</u></strong></p><ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul>`
    + (freqItems.length ? `<p><strong><u>${freqHeading}</u></strong></p><ul>${freqItems.map(f => `<li><strong>${f.label}</strong> : ${f.freq}</li>`).join("")}</ul>` : "");

  wrap.innerHTML = `
    <div class="bio-result-box">
      <div class="bio-result-head">
        <strong>${lines.length} examen${lines.length > 1 ? "s" : ""} à prescrire</strong>
        <div class="bio-result-actions">
          <button type="button" class="bio-copy-btn" id="bioCopyBtn">Copier le texte</button>
          <button type="button" class="bio-reset-btn" onclick="resetBioOrdonnance()">Réinitialiser</button>
        </div>
      </div>
      <div class="bio-result-preview">
        <p class="bio-result-heading">${heading}</p>
        <ul class="bio-result-list">
          ${lines.map(l => `<li>${l}</li>`).join("")}
        </ul>
        ${freqItems.length ? `
          <p class="bio-result-heading bio-freq-heading">🕒 ${freqHeading}</p>
          <ul class="bio-freq-list">
            ${freqItems.map(f => `<li><strong>${f.label}</strong> : ${f.freq}</li>`).join("")}
          </ul>
        ` : ""}
      </div>
    </div>
  `;

  const copyBtn = document.getElementById("bioCopyBtn");
  copyBtn.addEventListener("click", async () => {
    const done = () => {
      copyBtn.textContent = "Copié ✓";
      setTimeout(() => { copyBtn.textContent = "Copier le texte"; }, 1800);
    };
    try{
      if(navigator.clipboard && window.ClipboardItem){
        const item = new ClipboardItem({
          "text/plain": new Blob([plainText], { type: "text/plain" }),
          "text/html": new Blob([htmlText], { type: "text/html" })
        });
        await navigator.clipboard.write([item]);
        done();
        return;
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(plainText);
        done();
        return;
      }
      throw new Error("Clipboard API indisponible");
    }catch(err){
      // Repli pour navigateurs plus anciens : textarea temporaire hors écran.
      const ta = document.createElement("textarea");
      ta.value = plainText;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      done();
    }
  });
}

/* =====================================================================
   CALCULATEURS CLINIQUES — formules publiques, appliquées telles quelles.
   Sources : CKD-EPI 2021 (Inker NEJM 2021, sans variable ethnique),
   Cockcroft-Gault 1976, critères de dénutrition HAS/FFN 2021,
   CHA2DS2-VASc (ESC), HAS-BLED (Pisters 2010).
   ===================================================================== */
const CALC_TOOLS = [
  { id: "dfg", label: "Fonction rénale", sub: "DFG CKD-EPI 2021 + Cockcroft-Gault", color: "blue" },
  { id: "imc", label: "IMC", sub: "Indice de masse corporelle", color: "teal" },
  { id: "denutrition", label: "Dénutrition", sub: "Critères HAS 2021", color: "amber" },
  { id: "chads", label: "CHA₂DS₂-VASc", sub: "Risque thrombo-embolique (FA)", color: "red" },
  { id: "hasbled", label: "HAS-BLED", sub: "Risque hémorragique sous anticoagulant", color: "purple" }
];

function calcCkdEpi2021(screat_umol, age, sexe){
  const scr = screat_umol / 88.4;                 // µmol/L -> mg/dL
  const k = sexe === "F" ? 0.7 : 0.9;
  const a = sexe === "F" ? -0.241 : -0.302;
  const min = Math.min(scr / k, 1), max = Math.max(scr / k, 1);
  let e = 142 * Math.pow(min, a) * Math.pow(max, -1.200) * Math.pow(0.9938, age);
  if(sexe === "F") e *= 1.012;
  return e;
}

function calcCockcroft(screat_umol, age, poids, sexe){
  let cl = ((140 - age) * poids) / (0.814 * screat_umol);
  if(sexe === "F") cl *= 0.85;
  return cl;
}

function dfgStage(dfg){
  if(dfg >= 90) return { code: "G1", txt: "Normal ou élevé", color: "teal" };
  if(dfg >= 60) return { code: "G2", txt: "Légèrement diminué", color: "teal" };
  if(dfg >= 45) return { code: "G3a", txt: "Légèrement à modérément diminué", color: "amber" };
  if(dfg >= 30) return { code: "G3b", txt: "Modérément à sévèrement diminué", color: "amber" };
  if(dfg >= 15) return { code: "G4", txt: "Sévèrement diminué", color: "red" };
  return { code: "G5", txt: "Insuffisance rénale terminale", color: "red" };
}

function calcResultHTML(color, main, sub, extra){
  const rc = colorVars(color);
  return `<div class="calc-result" style="--pill:${rc.pill};--pillbg:${rc.pillbg}">
    <div class="calc-result-main">${main}</div>
    ${sub ? `<div class="calc-result-sub">${sub}</div>` : ""}
    ${extra || ""}
  </div>`;
}

function runCalc(){
  const out = document.getElementById("calcResult");
  if(!out) return;
  const tool = state.calcTool || "dfg";
  const val = id => { const el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; };
  const chk = id => { const el = document.getElementById(id); return el ? el.checked : false; };

  if(tool === "dfg"){
    const creat = val("cCreat"), age = val("cAge"), poids = val("cPoids");
    const sexeEl = document.getElementById("cSexe");
    const sexe = sexeEl ? sexeEl.value : "F";
    if(!creat || !age){ out.innerHTML = `<div class="calc-hint">Renseigne la créatininémie et l'âge.</div>`; return; }
    const dfg = calcCkdEpi2021(creat, age, sexe);
    const st = dfgStage(dfg);
    const cock = poids ? calcCockcroft(creat, age, poids, sexe) : null;
    out.innerHTML = calcResultHTML(st.color,
      `${dfg.toFixed(0)} mL/min/1,73 m²`,
      `Stade ${st.code} — ${st.txt}`,
      cock ? `<div class="calc-result-extra">Cockcroft-Gault : <strong>${cock.toFixed(0)} mL/min</strong> (adaptation posologique)</div>` : `<div class="calc-result-extra">Ajoute le poids pour obtenir aussi la clairance de Cockcroft-Gault.</div>`);
  }

  else if(tool === "imc"){
    const p = val("cPoids"), t = val("cTaille"), age = val("cAge");
    if(!p || !t){ out.innerHTML = `<div class="calc-hint">Renseigne le poids et la taille.</div>`; return; }
    const imc = p / Math.pow(t / 100, 2);
    let color = "teal", txt = "Corpulence normale";
    const seuilDenut = age >= 70 ? 22 : 18.5;
    if(imc < seuilDenut){ color = "red"; txt = `Sous le seuil de dénutrition (< ${seuilDenut} ${age >= 70 ? "à partir de 70 ans" : "avant 70 ans"})`; }
    else if(imc < 25){ color = "teal"; txt = "Corpulence normale"; }
    else if(imc < 30){ color = "amber"; txt = "Surpoids"; }
    else { color = "amber"; txt = "Obésité"; }
    out.innerHTML = calcResultHTML(color, `${imc.toFixed(1)} kg/m²`, txt,
      age ? "" : `<div class="calc-result-extra">Ajoute l'âge : le seuil de dénutrition diffère avant et après 70 ans.</div>`);
  }

  else if(tool === "denutrition"){
    const age = val("cAge"), imc = val("cImc"), alb = val("cAlb");
    const pheno = [chk("pheno1"), chk("pheno2"), chk("pheno3")].filter(Boolean).length;
    const etio = [chk("etio1"), chk("etio2"), chk("etio3")].filter(Boolean).length;
    if(!age){ out.innerHTML = `<div class="calc-hint">Renseigne l'âge (les seuils diffèrent avant et après 70 ans).</div>`; return; }
    const seuilImc = age >= 70 ? 22 : 18.5;
    const seuilSevere = age >= 70 ? 20 : 17;
    const phenoImc = imc && imc < seuilImc;
    const phenoTotal = pheno + (phenoImc ? 1 : 0);
    const diag = phenoTotal >= 1 && etio >= 1;
    const severe = diag && ((imc && imc < seuilSevere) || (alb && alb <= 30));
    let detail = `Critères phénotypiques : ${phenoTotal} (dont IMC ${phenoImc ? "< " + seuilImc + " ✓" : "non contributif"}) · Critères étiologiques : ${etio}`;
    if(!diag){
      out.innerHTML = calcResultHTML("slate", "Critères non réunis", detail,
        `<div class="calc-result-extra">Il faut au moins 1 critère phénotypique ET 1 critère étiologique.</div>`);
    }else{
      out.innerHTML = calcResultHTML(severe ? "red" : "amber",
        severe ? "Dénutrition sévère" : "Dénutrition",
        detail,
        severe ? `<div class="calc-result-extra">Sévérité retenue sur IMC &lt; ${seuilSevere} et/ou albuminémie ≤ 30 g/L.</div>`
               : `<div class="calc-result-extra">Critères de sévérité non atteints (IMC &lt; ${seuilSevere} ou albuminémie ≤ 30 g/L).</div>`);
    }
  }

  else if(tool === "chads"){
    let s = 0;
    if(chk("ch_c")) s += 1;
    if(chk("ch_h")) s += 1;
    if(chk("ch_a2")) s += 2;
    if(chk("ch_d")) s += 1;
    if(chk("ch_s2")) s += 2;
    if(chk("ch_v")) s += 1;
    if(chk("ch_a")) s += 1;
    if(chk("ch_sc")) s += 1;
    const color = s >= 2 ? "red" : (s === 1 ? "amber" : "teal");
    const txt = s >= 2 ? "Risque élevé — anticoagulation généralement recommandée"
              : (s === 1 ? "Risque intermédiaire — anticoagulation à discuter" : "Risque faible");
    out.innerHTML = calcResultHTML(color, `${s} / 9`, txt);
  }

  else{
    let s = 0;
    ["hb_h","hb_a1","hb_a2","hb_s","hb_b","hb_l","hb_e","hb_d","hb_dr"].forEach(id => { if(chk(id)) s += 1; });
    const color = s >= 3 ? "red" : (s === 2 ? "amber" : "teal");
    const txt = s >= 3 ? "Risque hémorragique élevé — corriger les facteurs modifiables, renforcer la surveillance"
              : "Risque hémorragique non élevé";
    out.innerHTML = calcResultHTML(color, `${s} / 9`, txt);
  }
}
window.runCalc = runCalc;

          <button type="button" class="bio-reset-btn" onclick="resetCourrier()">Réinitialiser</button>
        </div>
      </div>
      <div class="bio-result-preview courrier-preview">${plainText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>")}</div>
    </div>
  `;

  const btn = document.getElementById("courrierCopyBtn");
  btn.addEventListener("click", async () => {
    const done = () => {
      btn.textContent = "Copié ✓";
      setTimeout(() => { btn.textContent = "Copier le courrier"; }, 1800);
    };
    try{
      await navigator.clipboard.writeText(plainText);
      done();
    }catch(err){
      const ta = document.createElement("textarea");
      ta.value = plainText;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      done();
    }
  });
}

/* ---------- Charge anticholinergique (échelle ACB) ---------- */
function normalizeAcb(str){
  return String(str).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function addAcbMolecule(name){
  if(!state.acbSelected.includes(name)) state.acbSelected.push(name);
  state.acbQuery = "";
  renderAcbPanel();
}
window.addAcbMolecule = addAcbMolecule;

function removeAcbMolecule(i){
  state.acbSelected.splice(i, 1);
  renderAcbPanel();
}
window.removeAcbMolecule = removeAcbMolecule;

function resetAcb(){
  state.acbSelected = [];
  state.acbQuery = "";
  renderAcbPanel();
}
window.resetAcb = resetAcb;

function renderAcbPanel(){
  const cat = CATEGORIES.find(c => c.id === "medicaments-securite");
  const c = colorVars(cat.color);

  const total = state.acbSelected.reduce((sum, n) => {
    const m = ACB_MOLECULES.find(x => x.n === n);
    return sum + (m ? m.s : 0);
  }, 0);

  let verdict, vcolor;
  if(total === 0){ verdict = "Aucune charge anticholinergique identifiée"; vcolor = "teal"; }
  else if(total < 3){ verdict = "Charge faible à modérée — rester vigilant"; vcolor = "amber"; }
  else { verdict = "Charge cliniquement significative — réévaluation recommandée"; vcolor = "red"; }

  contentEl.innerHTML = `
    <button class="back-link" onclick="closeDoc()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M15 18l-6-6 6-6"/></svg>
      Retour — ${cat.label}
    </button>
    <div class="doc-page">
      <span class="panel-eyebrow" style="--pill:${c.pill};--pillbg:${c.pillbg}">${categoryIconHTML(cat.icon, cat.color, "xs")}Déprescription</span>
      <h2 class="panel-title" style="color:${c.pill}">Charge anticholinergique</h2>
      <p class="doc-meta">Saisis les molécules de l'ordonnance : le score ACB total se calcule automatiquement. Un score ≥ 3 est considéré comme cliniquement significatif.</p>

      <div class="bio-layout">
        <div class="bio-layout-left">
          <div class="bio-options-wrap">
            <span class="neurolep-label">Rechercher une molécule</span>
            <div class="medoc-search-wrap" style="margin-top:8px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" id="acbSearch" placeholder="Nom de la molécule (DCI)…" autocomplete="off" value="${(state.acbQuery || "").replace(/"/g, "&quot;")}" />
            </div>
            <div id="acbSuggestions"></div>
          </div>
        </div>
        <div class="bio-layout-right">
          <div class="bio-result-box">
            <div class="bio-result-head">
              <strong>Score ACB</strong>
              <div class="bio-result-actions">
                <button type="button" class="bio-reset-btn" onclick="resetAcb()">Réinitialiser</button>
              </div>
            </div>
            ${calcResultHTML(vcolor, `${total}`, verdict)}
            ${state.acbSelected.length ? `
              <ul class="acb-list">
                ${state.acbSelected.map((n, i) => {
                  const m = ACB_MOLECULES.find(x => x.n === n);
                  return `<li><span class="acb-score acb-score-${m.s}">${m.s}</span> ${n}
                    <button type="button" class="acb-remove" onclick="removeAcbMolecule(${i})" aria-label="Retirer">×</button></li>`;
                }).join("")}
              </ul>` : `<p class="doc-meta" style="margin-top:10px;">Aucune molécule ajoutée pour l'instant.</p>`}
          </div>
        </div>
      </div>

      <div class="doc-note" style="margin-top:18px;">
        <strong>Comment lire le score</strong>
        <p>Score par molécule : 1 = effet anticholinergique possible, 2 = effet établi modéré, 3 = effet marqué (associé au risque de confusion). Le score total est la somme des molécules. Un total ≥ 3 est cliniquement significatif ; le risque augmente avec chaque point supplémentaire. L'échelle ne tient pas compte de la dose. Toute décroissance doit être progressive, pour éviter un effet rebond.</p>
        <p style="margin-top:8px;">Source : échelle ACB (Anticholinergic Cognitive Burden, Boustani et al., mise à jour 2012), complétée de phénothiazines d'usage courant en France. Liste non exhaustive : l'absence d'une molécule ne signifie pas qu'elle est dépourvue d'effet anticholinergique.</p>
      </div>
    </div>`;

  const input = document.getElementById("acbSearch");
  input.addEventListener("input", e => {
    state.acbQuery = e.target.value;
    renderAcbSuggestions();
  });
  renderAcbSuggestions();
}

function renderAcbSuggestions(){
  const box = document.getElementById("acbSuggestions");
  if(!box) return;
  const q = (state.acbQuery || "").trim();
  if(!q){
    box.innerHTML = `<p class="doc-meta" style="margin-top:10px;">Tape les premières lettres d'une molécule pour l'ajouter.</p>`;
    return;
  }
  const qn = normalizeAcb(q);
  const matches = ACB_MOLECULES.filter(m => normalizeAcb(m.n).includes(qn) && !state.acbSelected.includes(m.n)).slice(0, 12);
  if(matches.length === 0){
    box.innerHTML = `<p class="doc-meta" style="margin-top:10px;">Aucune molécule trouvée pour « ${q} » dans cette échelle.</p>`;
    return;
  }
  box.innerHTML = `<div class="acb-suggestions">${matches.map(m => `
    <button type="button" class="acb-suggestion" onclick="addAcbMolecule('${m.n.replace(/'/g, "\\'")}')">
      <span class="acb-score acb-score-${m.s}">${m.s}</span> ${m.n}
    </button>`).join("")}</div>`;
}

    </div>

    ${groupsHTML}
  `;
}

function renderSearchPanel(){
  const q = state.query.trim().toLowerCase();
  const results = PROTOCOLS
    .filter(p => p.title.toLowerCase().includes(q))
    .map(p => ({ item: p, cat: CATEGORIES.find(c => c.id === p.category) }));

  const body = results.length
    ? `<div class="grid">${results.map(r => cardHTML(r.item, r.cat)).join("")}</div>`
    : `<div class="empty-state">Aucun protocole ne correspond à « ${state.query} ».</div>`;

  contentEl.innerHTML = `
    <div class="panel-head">
      <span class="panel-eyebrow">🔎 Recherche</span>
      <h2 class="panel-title">${results.length} résultat${results.length > 1 ? "s" : ""} pour « ${state.query} »</h2>
    </div>
    ${body}
  `;
}

function render(){
  renderSidebar();
  if(state.activeDoc === "neuroleptiques-classiques" && state.explorerMode){
    renderNeurolepPanel();
  }else if(state.activeDoc === "benzodiazepines" && state.explorerMode){
    renderBenzoExplorerPanel();
  }else if(state.activeDoc === "ordonnance-biologie" && state.explorerMode){
    renderBioOrdonnancePanel();
  }else if(state.activeDoc === "calculateurs-cliniques" && state.explorerMode){
    renderCalcPanel();
  }else if(state.activeDoc === "trames-courriers" && state.explorerMode){
    renderCourrierPanel();
  }else if(state.activeDoc === "vaccination-esms" && state.explorerMode){
    renderVaccinPanel();
  }else if(state.activeDoc === "vaccination-pediatrique" && state.explorerMode){
    renderVaccinPediaPanel();
  }else if(state.activeDoc === "deprescription-classes" && state.explorerMode){
    renderDeprescClassePanel();
  }else if(state.activeDoc === "deprescription-situations" && state.explorerMode){
    renderDeprescSituationPanel();
  }else if(state.activeDoc === "charge-anticholinergique" && state.explorerMode){
    renderAcbPanel();
  }else if(state.activeDoc){
    renderEmbedPage(state.activeDoc);
  }else if(state.query){
    renderSearchPanel();
  }else if(state.activeId === "ressources"){
    renderResourcesPanel();
  }else if(state.activeId === "medicaments-ecrasables"){
    renderMedocsPanel(CATEGORIES.find(c => c.id === "medicaments-ecrasables"));
  }else{
    const cat = CATEGORIES.find(c => c.id === state.activeId) || CATEGORIES[0];
    renderCategoryPanel(cat);
  }
}

searchEl.addEventListener("input", e => {
  state.query = e.target.value;
  state.activeDoc = null;
  render();
});

/* Fond dynamique : le calque d'arrière-plan descend doucement quand on fait
   défiler la page, ce qui donne de la profondeur sans distraire de la lecture.
   Le déplacement est volontairement limité (≤ 90 px) et désactivé si la
   personne a demandé à réduire les animations dans son système. */
(function initParallaxBackground(){
  const layer = document.getElementById("bgLayer");
  if(!layer) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  let ticking = false;
  function update(){
    const offset = Math.min(window.scrollY * 0.18, 90);
    layer.style.transform = `translate3d(0, ${offset}px, 0)`;
    ticking = false;
  }
  window.addEventListener("scroll", () => {
    if(!ticking){
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });
  update();
})();

/* Démarrage */
render();
</script>
